[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../../node_modules"]
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "ipfs"
